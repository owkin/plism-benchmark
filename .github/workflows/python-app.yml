name: Python dev

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10"]
    name: Testing Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main at 2026-07-07
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: make install-poetry

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub

      - name: Log in to Hugging Face
        run: |
          python -c "from huggingface_hub import login; login(token='${{ secrets.HF_TOKEN }}')"

      - name: Install git lfs
        run: |
          git lfs install
          git lfs pull

      - name: Install dependencies
        run: make install-all

      - name: Testing
        run: poetry run make test

  linting:
    runs-on: ubuntu-latest
    name: Test Linting
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: make install-poetry

      - name: Install dependencies
        run: poetry install --all-extras --with=linting,docs

      - name: Test pre-commit checks
        run: poetry run make pre-commit-checks

      - name: Test linting
        run: poetry run make lint

      - name: Test typing
        run: poetry run make typing

      - name: Test docs
        run: poetry run make test-docs
